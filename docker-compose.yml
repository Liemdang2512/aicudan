version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aicudan-backend:latest
    container_name: aicudan-backend
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3010
      - SERVER_URL=https://aicudan.congsu.ai.vn
    networks:
      - aicudan-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://aicudan.congsu.ai.vn/api/v1}
    image: aicudan-frontend:latest
    container_name: aicudan-frontend
    restart: unless-stopped
    ports:
      - "3010:3000"
    depends_on:
      - backend
    networks:
      - aicudan-net

volumes:
  backend_data:
  backend_uploads:

networks:
  aicudan-net:
    driver: bridge
